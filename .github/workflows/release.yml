# Builds Sayla for Windows (.exe) and Mac (.dmg) and puts them in a GitHub Release.
# Runs when a version tag is pushed (git tag v1.0.0 && git push --tags): builds AND publishes the GitHub Release.
# By hand from the Actions tab (Run workflow): builds only, and the files are attached to the run ("Artifacts") to test first.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Build and publish
        run: npx electron-builder ${{ matrix.os == 'windows-latest' && '--win nsis appx' || '--mac' }} --publish ${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Keep the files of a test build
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: sayla-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.appx
            dist/*.dmg
          retention-days: 14
